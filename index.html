<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone_2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <ul>
            <li class="brand"><i class="fa-brands fa-spotify" style="color: #1DB954; margin-right: 8px;"></i> Spotify</li>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="songBanner"></div>

        <main class="songList">
            <h2>Best of Bollywood - Super Hits</h2>
            <div class="songItemContainer"></div>
        </main>
    </div>

    <footer class="bottom">
        <div class="progress-container">
            <span id="currentTimeDisplay">0:00</span>
            <input type="range" id="myProgressBar" min="0" max="100" value="0">
            <span id="totalTimeDisplay">0:00</span>
        </div>
        
        <div class="player-interface-row">
            <div class="songInfo">
                <img src="playing.gif" id="gif" width="30px" alt="playing">
                <span id="masterSongName">Track 1</span>
            </div>

            <div class="icons">
                <i class="fa-solid fa-backward-step" id="previous"></i>
                <i class="fa-solid fa-circle-play" id="masterPlay"></i>
                <i class="fa-solid fa-forward-step" id="next"></i>
            </div>

            <div class="volume-container">
                <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="100">
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
